name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-unsigned-dmg:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: LSA-macos-unsigned
          path: |
            release/*.dmg
            release/*.zip

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run package:portable
      - uses: actions/upload-artifact@v4
        with:
          name: LSA-windows-portable
          path: release/LSA-portable
